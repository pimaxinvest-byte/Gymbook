<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a0a00"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2200" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#cc1100" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#880000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#ffe066"/>
      <stop offset="30%" stop-color="#ffd700"/>
      <stop offset="60%" stop-color="#e6a800"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
    <linearGradient id="goldBolt" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"  stop-color="#fff3a0"/>
      <stop offset="40%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#c8900a"/>
    </linearGradient>
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="boltGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>

  <!-- Red glow halo -->
  <circle cx="256" cy="256" r="220" fill="url(#glow)" opacity="0.7"/>

  <!-- Outer red ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#cc1100" stroke-width="6" opacity="0.9" filter="url(#glowFilter)"/>
  <circle cx="256" cy="256" r="205" fill="none" stroke="#ff3300" stroke-width="2.5" opacity="0.6"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="#aa0000" stroke-width="2" opacity="0.4"/>

  <!-- Gold outer ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#gold)" stroke-width="14" opacity="0.95"/>

  <!-- Inner ring subtle -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#b8860b" stroke-width="3" opacity="0.5"/>

  <!-- Lightning bolt -->
  <polygon
    points="300,70 195,280 250,280 210,445 320,220 262,220 300,70"
    fill="url(#goldBolt)"
    filter="url(#boltGlow)"
  />

  <!-- Bolt highlight -->
  <polygon
    points="300,70 265,175 282,175 300,70"
    fill="#fff7c0"
    opacity="0.6"
  />

  <!-- Sparkles -->
  <g fill="#ffd700" opacity="0.8">
    <polygon points="80,100 84,112 96,116 84,120 80,132 76,120 64,116 76,112" transform="scale(0.7) translate(50,80)"/>
    <polygon points="420,360 424,372 436,376 424,380 420,392 416,380 404,376 416,372" transform="scale(0.5) translate(420,300)"/>
    <polygon points="70,350 73,358 81,361 73,364 70,372 67,364 59,361 67,358" transform="scale(0.6) translate(60,240)"/>
  </g>
</svg>
